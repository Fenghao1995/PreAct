name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,data]"
      - run: ruff check .
      - run: python -m compileall -q preact lerobot_robot_preact_franka scripts
      - name: Validate all paper experiment configs
        run: |
          for cfg in configs/experiments/*.yaml; do
            python scripts/validate_config.py "$cfg"
          done
      - name: Validate all real-robot task configs
        run: |
          for cfg in configs/real_robot/{pick_place,insert,push_tennis}.yaml; do
            python scripts/validate_real_config.py "$cfg"
          done
