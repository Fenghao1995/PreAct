task:
  name: push_tennis
  description: Push the tennis ball along the red track until it crosses the final red line.
  success: The ball follows the red track and crosses its final line.
  observation_shape: [2, 3, 240, 424]
  action_dim: 7
  state_dim: 15
  maximum_episode_steps: 19
  evaluation:
    id: Push a 7 cm tennis ball along the 45 cm x 9.5 cm red track past its final line.
    ood: null # The paper explicitly reports no separate OOD scene.
  random_play:
    - vary ball initial position and robot approach direction
    - vary contact point, pushing speed, and pushing distance
    - include misses, weak contacts, overshoot, and different rolling directions

hardware:
  host: ${PREACT_FRANKA_HOST}
  port: 4242
  cameras:
    - {name: wrist, serial: "${PREACT_WRIST_CAMERA_SERIAL}", width: 424, height: 240, fps: 15}
    - {name: exterior, serial: "${PREACT_EXTERIOR_CAMERA_SERIAL}", width: 424, height: 240, fps: 15}
  home_joints_rad: [0.0424, -0.5245, -0.0951, -2.7361, 0.003, 2.9713, 0.8088]
  gripper_max_open_m: 0.080
  gripper_speed_m_s: 0.1
  gripper_force_n: 20.0
  reset_gripper_open: false
  debug: false
  safety:
    max_translation_m: 0.02
    max_rotation_rad: 0.10
    ema_alpha: 0.4
    workspace_min_m: null # Set measured task-specific bounds in hardware.local.yaml.
    workspace_max_m: null

collection:
  expert_rollouts: 50
  random_play_rollouts: 10
  calibration_rollouts: 20
  fps: 15
  data_root: ${PREACT_DATA_ROOT}
