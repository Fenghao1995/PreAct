task:
  name: pick_place
  description: Pick up the blue cube and place it on top of the box.
  success: The cube is grasped and remains on top of the box.
  observation_shape: [2, 3, 240, 424]
  action_dim: 7
  state_dim: 15
  maximum_episode_steps: 49
  evaluation:
    id: Blue 5 cm cube centered in a 12.5 cm cell of the orange 3 x 3 grid.
    ood: Move the cube approximately 1-2 cm outside the center grid cell.
  random_play:
    - approach and lightly touch the cube
    - grasp with small offsets or close the gripper early/late
    - move and place with small offsets
    - make local readjustments near the box

hardware:
  host: ${PREACT_FRANKA_HOST}
  port: 4242
  cameras:
    - {name: wrist, serial: "${PREACT_WRIST_CAMERA_SERIAL}", width: 424, height: 240, fps: 15}
    - {name: exterior, serial: "${PREACT_EXTERIOR_CAMERA_SERIAL}", width: 424, height: 240, fps: 15}
  home_joints_rad: [0.0424, -0.5245, -0.0951, -2.7361, 0.003, 2.9713, 0.8088]
  gripper_max_open_m: 0.080
  gripper_speed_m_s: 0.1
  gripper_force_n: 20.0
  reset_gripper_open: false
  debug: false
  safety:
    max_translation_m: 0.02
    max_rotation_rad: 0.10
    ema_alpha: 0.4
    workspace_min_m: null # Set measured task-specific bounds in hardware.local.yaml.
    workspace_max_m: null

collection:
  expert_rollouts: 50
  random_play_rollouts: 10
  calibration_rollouts: 20
  fps: 15
  data_root: ${PREACT_DATA_ROOT}
